<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="preload" href="assets/fonts/fuente.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Entry screen — first thing visible on load -->
    <div id="entry-screen">
      <div id="entry-symbol"></div>
    </div>

    <div id="main-content">

      <!-- Hidden SVG filter for the name interference effect.
           JS changes the seed every 40ms to animate it. -->
      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence id="name-turb" type="turbulence"
              baseFrequency="0.008 1.1" numOctaves="1" seed="1" result="noise" />
            <feDisplacementMap id="name-disp"
              in="SourceGraphic" in2="noise" scale="6"
              xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
      </svg>

      <!-- Background video — starts (with audio) on entry click -->
      <video id="bg-video" muted loop playsinline preload="none" aria-hidden="true">
        <source id="bg-video-source" type="video/mp4" />
      </video>

      <!-- Background particles canvas -->
      <canvas id="bg-canvas"></canvas>

      <div id="profile-stack">
        <!-- Profile card -->
        <div id="profile-card">

        <!-- Section 1: avatar + name + status -->
        <div id="profile-main">
          <div id="avatar-wrapper">
            <img id="avatar" alt="avatar" />
            <img id="avatar-decoration" alt="" />
          </div>
          <div id="profile-info">
            <div id="profile-name">
              <div id="name-row">
                <div class="name-wrapper">
                  <span id="name-text"></span>
                  <span class="name-tooltip" id="name-tooltip"></span>
                </div>
                <div id="badges"></div>
              </div>
            </div>
            <p id="profile-status"></p>
          </div>
        </div>

        <!-- Section 2: Discord presence (static, edit in config.js) -->
        <div id="discord-presence">
          <div id="discord-avatar-wrapper">
            <img id="discord-avatar" alt="discord avatar" />
            <img id="discord-status-icon" alt="" />
          </div>
          <div id="discord-info">
            <span id="discord-username"></span>
            <span id="discord-activity"></span>
          </div>
        </div>

        <!-- Section 3: social links (generated from config.js) -->
        <div id="social-links"></div>

        </div>

        <section id="music-player" aria-label="Музыкальный плеер">
          <audio id="music-audio" preload="metadata"></audio>
          <div class="music-player-main">
            <div class="music-player-cover" aria-hidden="true">♪</div>
            <div class="music-player-info">
              <span class="music-player-label">Музыка</span>
              <span id="music-title">Музыка не добавлена</span>
              <span id="music-artist">Добавьте .mp3 в assets/music</span>
            </div>
            <div class="music-player-controls">
              <button id="music-previous" type="button" aria-label="Предыдущий трек">‹</button>
              <button id="music-toggle" type="button" aria-label="Включить музыку">▶</button>
              <button id="music-next" type="button" aria-label="Следующий трек">›</button>
            </div>
          </div>
          <div class="music-player-timeline">
            <input id="music-progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция воспроизведения" />
            <div class="music-player-times">
              <span id="music-current-time">0:00</span>
              <span id="music-duration">0:00</span>
            </div>
          </div>
        </section>
      </div>

    </div>

    <!-- Cursor sparkle trail canvas — above everything -->
    <canvas id="cursor-canvas"></canvas>

    <!-- config.js must load before script.js -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
